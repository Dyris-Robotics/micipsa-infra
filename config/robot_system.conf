# =============================================================================
#                                   GENERAL
# =============================================================================
CURRENT_USER="${SUDO_USER:-$USER}"
ROBOT_NAME="micipsa"

# =============================================================================
#                               WORKSPACE SETUP
# =============================================================================

# ======================
#  Infra Repository Root
# ======================
INFRA_ROOT="${INFRA_ROOT:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"

# ===============
#  ROS2 Workspace
# ===============
ROS2_WS="${ROS2_WS:-/home/${CURRENT_USER}/ros2_ws_deploy}"

# ===============
#  Git Repository
# ===============
REPO_URL="${REPO_URL:-https://github.com/Dyris-Robotics/micipsa.git}"
REPO_REF="${REPO_REF:-main}" # branch, tag or commit hash
REPO_ROOT="${ROS2_WS}/src/${ROBOT_NAME}"

# ==================
#  Vcstool Manifests
# ==================
REPOS_FILES=(
    "${REPO_ROOT}/micipsa.repos"
    "${REPO_ROOT}/micipsa_deploy.repos"
)

# ===================
#  Installers Scripts
# ===================
INSTALLERS_SCRIPTS_DIR="${INFRA_ROOT}/scripts/installers"
UNINSTALLERS_SCRIPTS_DIR="${INFRA_ROOT}/scripts/uninstallers"

# =============================================================================
#                                   DOCKER
# =============================================================================
DOCKER_DIR="${INFRA_ROOT}/docker"

DOCKER_OS_BASE_IMAGE_X86="ubuntu:24.04"
DOCKER_OS_BASE_IMAGE_ARM="docker.io/arm64v8/ubuntu:24.04"

FOUNDATION_DOCKERFILE="${DOCKER_DIR}/base/Dockerfile"
DOCKER_COMPOSE_FILE="${DOCKER_DIR}/docker-compose.yaml"
DOCKER_COMPOSE_DEPLOY="${DOCKER_DIR}/docker-compose.deploy.yaml"

# =============================================================================
#                                   UDEV RULES
# =============================================================================
UDEV_RULES_DIR="${INFRA_ROOT}/udev"

# =============================================================================
#                                   Helpers Scripts
# =============================================================================
HELPERS_SCRIPTS_DIR="${INFRA_ROOT}/scripts/helpers"

# =============================================================================
#                                   Docker Compose Launcher
# =============================================================================
DOCKER_COMPOSE_LAUNCHER_DIR="${INFRA_ROOT}/docker/scripts"

# =============================================================================
#                                CONFIG FILES
# =============================================================================
STACK_CONFIG_ITEMS=(
    "micipsa_robot/micipsa_bringup/config"
    "micipsa_robot/micipsa_maps/maps"
)

INFRA_CONFIG_ITEMS=(
    "dds"
    "docker/docker-compose.yaml"
    "docker/docker-compose.sim.yaml"
    "docker/docker-compose.deploy.yaml"
)


# =============================================================================
#                                   Systemd Services
# =============================================================================
SYSTEMD_SERVICES_DIR="${INFRA_ROOT}/systemd"


# =============================================================================
#                                   NETWORK
# =============================================================================
RMEM_MAX=67108864
RMEM_DEFAULT=67108864
WMEM_MAX=67108864
WMEM_DEFAULT=67108864

SYSCTL_CONF_DIR="/etc/sysctl.d"
SYSCTL_CONF_FILE="${SYSCTL_CONF_DIR}/99-micipsa-network.conf"
RC_LOCAL="/etc/rc.local"

# =============================================================================
#                                   UTILS
# =============================================================================
UTILS_DIR="${REPO_ROOT}/utils"

# =============================================================================
#                                INSTALL PATHS
# =============================================================================
UTILS_DIR_INSTALL_LOCATION="/usr/local/lib/${ROBOT_NAME}"
BIN_DIR_INSTALL_LOCATION="/usr/local/bin"
UDEV_RULES_DIR_INSTALL_LOCATION="/etc/udev/rules.d"
HELPERS_SCRIPTS_DIR_INSTALL_LOCATION="${BIN_DIR_INSTALL_LOCATION}"
CONFIG_DIR_INSTALL_LOCATION="/etc/${ROBOT_NAME}"
INFRA_CONFIG_DIR_INSTALL_LOCATION="${CONFIG_DIR_INSTALL_LOCATION}/infra"

# Directory where compose_launcher.py + its modules live together
DOCKER_COMPOSE_LAUNCHER_INSTALL_DIR="${UTILS_DIR_INSTALL_LOCATION}/compose_launcher"
DOCKER_COMPOSE_LAUNCHER_INSTALL_FILE="${DOCKER_COMPOSE_LAUNCHER_INSTALL_DIR}/compose_launcher.py"
DOCKER_COMPOSE_LAUNCHER_WRAPPER_FILE="${BIN_DIR_INSTALL_LOCATION}/compose_launcher"

SYSTEMD_SERVICES_DIR_INSTALL_LOCATION="/etc/systemd/system"
